<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Welcome to my client page.">
    <title>APEX resource page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <nav class="navbar bg-1 fg-2 site-navbar" aria-label="Main navigation">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">APEX resource page</a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end site-nav-drawer" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                    <div class="drawer-header">
                        <h2 class="drawer-title" id="navbarDrawerLabel">Menu</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                    <div class="drawer-body">
                        <ul class="navbar-nav me-auto mb-2 md:mb-0">
                            <li class="nav-item">
                                <a class="nav-link basicButton site-nav-link" href="#">Info about APEX</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link basicButton site-nav-link" href="#">More links</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link basicButton site-nav-link" href="#">blank</a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>
    </header>
    <main id="main">
        <p class="page-intro">Hello, welcome to the APEX resource page. You can find info about APEX here, and there are soem links that can redirect you if need more info :)</p>
        <img src="image.png" alt="School default" class="default-image" style="display: block; margin-inline: auto;">
    </main>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script type="module">
        const navbarToggler = document.querySelector('[aria-controls="navbarDrawer"]');
        const navbarDrawer = document.querySelector("#navbarDrawer");

        navbarDrawer.addEventListener("shown.bs.drawer", () => {
            navbarToggler.setAttribute("aria-expanded", "true");
        });
        navbarDrawer.addEventListener("hidden.bs.drawer", () => {
            navbarToggler.setAttribute("aria-expanded", "false");
        });
    </script>
</body>
</html>
